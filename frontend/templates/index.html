<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETM · Grid Co.</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img class="brand-logo" src="/static/img/logo.png" alt="Grid Co." />
      <div>
        <h1>Estações Meteorológicas</h1>
        <p>Grid Co. &middot; Engenharia de O&amp;M <span id="app-version" class="app-version"></span></p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="planner">Planner</button>
      <button class="tab-btn" data-tab="historico">Histórico</button>
    </nav>
    <div class="nome-usuario-wrapper">
      <label for="nome-usuario-input">Seu nome</label>
      <input id="nome-usuario-input" type="text" placeholder="Ex: João Vieira" autocomplete="off" />
    </div>
    <button id="refresh-btn" class="refresh-btn" title="Atualizar dados do Fracttal">⟳ Atualizar</button>
  </header>

  <div id="update-banner" class="update-banner hidden">
    <span id="update-banner-text"></span>
    <div class="update-banner-actions">
      <button id="update-apply-btn" class="update-apply-btn">Atualizar agora</button>
      <button id="update-dismiss-btn" class="update-dismiss-btn" title="Lembrar depois">&times;</button>
    </div>
  </div>

  <main>
    <!-- SEÇÃO 1: PLANNER -->
    <section id="tab-planner" class="tab-panel active">
      <div id="planner-status" class="status-line"></div>

      <div class="filtros-bar">
        <div class="filtro-item">
          <label for="filtro-cliente">Cliente</label>
          <select id="filtro-cliente">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filtro-item">
          <label for="filtro-usina">Usina</label>
          <input id="filtro-usina" type="text" placeholder="Buscar usina..." autocomplete="off" />
        </div>
        <div class="filtro-item combobox" id="filtro-criador-wrapper">
          <label for="filtro-criador-input">Criado por</label>
          <input id="filtro-criador-input" type="text" placeholder="Todos" autocomplete="off" />
          <div id="filtro-criador-dropdown" class="combobox-dropdown hidden"></div>
        </div>
        <div class="filtro-item combobox" id="filtro-responsavel-wrapper">
          <label for="filtro-responsavel-input">Responsável</label>
          <input id="filtro-responsavel-input" type="text" placeholder="Todos" autocomplete="off" />
          <div id="filtro-responsavel-dropdown" class="combobox-dropdown hidden"></div>
        </div>
        <div class="filtro-item">
          <label>Tipo de trabalho</label>
          <div class="filtro-chips-inline">
            <button type="button" class="tag-chip selected" data-tipo="analise">Análise de Engenharia</button>
            <button type="button" class="tag-chip selected" data-tipo="campo">Campo</button>
          </div>
        </div>
        <div class="filtro-item filtro-checkbox-item">
          <label class="filtro-checkbox-label">
            <input type="checkbox" id="filtro-mostrar-canceladas-planner" />
            Mostrar canceladas
          </label>
        </div>
        <button id="filtro-limpar" class="filtro-limpar-btn">Limpar filtros</button>
      </div>

      <div class="board">
        <div class="column">
          <h2 class="column-title col-nao-iniciada">
            <button class="collapse-btn" data-target="col-nao-iniciada" aria-expanded="true">▾</button>
            <span>Não iniciadas</span>
            <span id="count-nao-iniciada" class="count"></span>
          </h2>
          <div id="col-nao-iniciada" class="card-list"></div>
        </div>
        <div class="column">
          <h2 class="column-title col-em-andamento">
            <button class="collapse-btn" data-target="col-em-andamento" aria-expanded="true">▾</button>
            <span>Em andamento</span>
            <span id="count-em-andamento" class="count"></span>
          </h2>
          <div id="tag-filtro-row" class="tag-filtro-row"></div>
          <div id="col-em-andamento" class="card-list"></div>
        </div>
        <div class="column">
          <h2 class="column-title col-finalizada">
            <button class="collapse-btn" data-target="col-finalizada" aria-expanded="true">▾</button>
            <span>Finalizadas</span>
            <span id="count-finalizada" class="count"></span>
          </h2>
          <div id="col-finalizada" class="card-list"></div>
        </div>
        <div class="column hidden" id="coluna-canceladas">
          <h2 class="column-title col-cancelada">
            <button class="collapse-btn" data-target="col-cancelada" aria-expanded="true">▾</button>
            <span>Canceladas</span>
            <span id="count-cancelada" class="count"></span>
          </h2>
          <div id="col-cancelada" class="card-list"></div>
        </div>
      </div>
    </section>

    <!-- SEÇÃO 2: HISTÓRICO -->
    <section id="tab-historico" class="tab-panel">
      <div id="historico-clientes-view">
        <div id="historico-status" class="status-line"></div>
        <div id="clientes-grid" class="clientes-grid"></div>
      </div>
      <div id="historico-lista-view" class="hidden">
        <button id="voltar-clientes" class="back-btn">&larr; Voltar aos clientes</button>
        <h2 id="cliente-titulo"></h2>
        <input id="filtro-usina-historico" type="text" class="busca-usina-input" placeholder="Buscar usina..." autocomplete="off" />
        <div id="usinas-grid" class="usinas-grid"></div>
      </div>
      <div id="historico-detalhe-view" class="hidden">
        <button id="voltar-usinas" class="back-btn">&larr; Voltar às usinas</button>
        <div class="usina-titulo-row">
          <h2 id="usina-titulo"></h2>
          <button id="abrir-chat-usina-btn" class="abrir-chat-usina-btn" title="Ver chat de todas as OS desta usina">Chat da usina ‹</button>
        </div>
        <label class="filtro-checkbox-label filtro-checkbox-historico">
          <input type="checkbox" id="filtro-mostrar-canceladas-historico" />
          Mostrar canceladas
        </label>
        <div id="usina-historico-lista" class="history-list"></div>
      </div>
    </section>
  </main>

  <div id="chat-usina-overlay" class="chat-usina-overlay hidden"></div>
  <aside id="chat-usina-panel" class="chat-usina-panel">
    <div class="chat-usina-header">
      <h3 id="chat-usina-titulo">Chat da usina</h3>
      <button id="fechar-chat-usina-btn" class="modal-close">&times;</button>
    </div>
    <div id="chat-usina-status" class="status-line"></div>
    <div id="chat-usina-lista" class="comentarios-lista chat-usina-lista"></div>
  </aside>

  <div id="os-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card modal-card-wide">
      <button id="modal-close" class="modal-close">&times;</button>
      <div class="modal-body-grid">
        <div id="modal-content" class="modal-details"></div>
        <div class="modal-comments">
          <h4>Comentários</h4>
          <div id="comentarios-lista" class="comentarios-lista"></div>
          <div id="comentario-aviso-nome" class="comentario-aviso hidden">
            Preencha seu nome no topo do app pra poder comentar.
          </div>
          <div class="comentario-input-row">
            <textarea id="comentario-texto" placeholder="Escreva um comentário..." rows="2"></textarea>
            <button id="comentario-enviar-btn" type="button">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
